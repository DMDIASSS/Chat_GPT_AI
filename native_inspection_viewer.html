<!doctype html><html lang="en"><meta charset="utf-8"><title>Native policy inspection</title>
<style>body{font:15px system-ui;background:#101722;color:#eef3ff;margin:24px}h1{font-size:23px}select,button,input{padding:8px;background:#253348;color:white;border:1px solid #59708f;border-radius:5px}canvas{background:#13261d;border:1px solid #667;border-radius:8px;max-width:100%}table{border-collapse:collapse;margin:16px 0}td,th{padding:7px 12px;border-bottom:1px solid #344356;text-align:left}.layout{display:flex;gap:24px;flex-wrap:wrap}pre{white-space:pre-wrap;max-width:450px}.note{color:#b5c4db;max-width:950px}input{width:70%}</style>
<h1>Native policy inspection</h1><p class="note">Actual RocketSim rollout playback. The arrow shows car heading; colors show teams. Blue attacks the upper goal, orange the lower goal. Shot counts are geometric proxies. These short screens do not certify the best competitive model.</p>
<div id="summary"></div><select id="case"></select> <button id="play">Play / pause</button> <select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option><option value="2">2×</option><option value="4">4×</option></select>
<p><input type="range" id="time" min="0" max="1" step="1" value="0"> <span id="stamp"></span></p><div class="layout"><canvas id="field" width="650" height="760"></canvas><pre id="details"></pre></div>
<script>const report=__REPORT_DATA__;
const el=id=>document.getElementById(id),ctx=el('field').getContext('2d');let row,index=0,playing=false,previous=0;
const table=document.createElement('table');table.innerHTML='<tr><th>Policy</th><th>Task</th><th>Scored cases</th><th>Goals</th><th>Conceded</th><th>Contacts</th><th>Goalward contacts</th><th>Idle</th></tr>';
for(const r of report.summary||[]){const tr=document.createElement('tr');for(const v of [r.model,r.task,r.scored_cases+'/'+r.cases,r.goals_for,r.goals_against,r.contact_events,r.goalward_contacts,(100*r.idle_fraction).toFixed(1)+'%']){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}table.appendChild(tr)}el('summary').appendChild(table);
report.records.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${r.model} · ${r.task} · ${r.side} · seed ${r.seed} · ${r.goals_for}:${r.goals_against}`;el('case').appendChild(o)});
const xy=p=>[325+p[0]*.069,380-p[1]*.069];function line(a,b,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...xy(a));ctx.lineTo(...xy(b));ctx.stroke()}
function draw(){const f=row.frames[Math.min(Math.floor(index),row.frames.length-1)];if(!f)return;ctx.clearRect(0,0,650,760);ctx.strokeStyle='#849d8a';ctx.lineWidth=2;ctx.strokeRect(...xy([-4096,5120]),8192*.069,10240*.069);line([-4096,0],[4096,0],'#849d8a');line([-893,5120],[893,5120],'#55a4ff',8);line([-893,-5120],[893,-5120],'#ffa458',8);
for(let i=Math.max(1,Math.floor(index)-120);i<Math.floor(index);i++){const a=row.frames[i-1],b=row.frames[i];if(a.episode===f.episode&&b.episode===f.episode)line(a.ball,b.ball,'#cfd6b34d',2)}
for(const c of f.cars){const p=xy(c.pos);ctx.fillStyle=c.team===0?'#4aa4ff':'#ffa458';ctx.beginPath();ctx.arc(...p,9,0,2*Math.PI);ctx.fill();line(c.pos,c.pos.map((v,i)=>v+c.forward[i]*260),ctx.fillStyle,3)}const ball=xy(f.ball);ctx.fillStyle='#fff7c9';ctx.beginPath();ctx.arc(...ball,6+Math.min(10,f.ball[2]/200),0,2*Math.PI);ctx.fill();el('time').value=Math.floor(index);el('stamp').textContent=f.t.toFixed(2)+' s';
const stats={...row};delete stats.frames;el('details').textContent=JSON.stringify({episode:f.episode,ball_height:f.ball[2],controls:{throttle:f.controls[0],steer:f.controls[1],pitch:f.controls[2],yaw:f.controls[3],roll:f.controls[4],jump:f.controls[5],boost:f.controls[6],handbrake:f.controls[7]},policy:f.policy,metrics:stats},null,2)}
function choose(){row=report.records[+el('case').value];index=0;el('time').max=Math.max(0,row.frames.length-1);draw()}el('case').onchange=choose;el('time').oninput=()=>{index=+el('time').value;draw()};el('play').onclick=()=>playing=!playing;function frame(t){if(playing&&previous&&row){index+=Math.min(.1,(t-previous)/1000)*30*+el('speed').value;if(index>=row.frames.length-1){index=row.frames.length-1;playing=false}draw()}previous=t;requestAnimationFrame(frame)}if(report.records.length)choose();requestAnimationFrame(frame);
</script></html>
