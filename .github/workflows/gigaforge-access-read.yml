name: Windows native file access checks
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['GigaForge/native_access.py', 'GigaForge/tests/test_native_access.py', '.github/workflows/gigaforge-access-read.yml']
permissions:
  contents: read
jobs:
  windows-access:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest GigaForge/tests/test_native_access.py -q
