name: GigaForge Windows dependency finder
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['GigaForge/runtime_finder.py', 'GigaForge/runtime_bootstrap.py', 'GigaForge/setup_runtime.py', 'GigaForge/*.bat', 'GigaForge/tests/test_runtime_finder.py', '.github/workflows/gigaforge-runtime.yml']
permissions:
  contents: read
jobs:
  windows-runtime:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest GigaForge/tests/test_runtime_finder.py -q
