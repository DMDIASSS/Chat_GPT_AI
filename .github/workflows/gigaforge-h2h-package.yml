name: Test and package frozen 200x100 WDL
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['research/package_h2h_release.py', '.github/workflows/gigaforge-h2h-package.yml', 'GigaForge/head_to_head.py', 'GigaForge/tests/check_head_to_head.py']
permissions:
  contents: write
  actions: read
jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      NATIVE_VERIFIED_RUN: '42404829974'
      GIGAFORGE_EXE: '${{ github.workspace }}\verified-native\GigaForge.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: NovaForge/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: GigaForge-windows-CPU-verified-preview
          path: verified-native
          run-id: 42404829974
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pinned runtime
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r NovaForge/requirements.txt
      - name: H2H native loading, counts, resume, paused state and 100-second games
        run: python GigaForge/tests/check_head_to_head.py
      - name: Selection and research regression tests
        run: python -m pytest GigaForge/tests/test_trial_watch.py GigaForge/tests/test_research.py GigaForge/tests/test_research_eval.py -q
      - name: Package verified update
        run: python research/package_h2h_release.py
      - name: Publish downloads and validation record
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add GigaForge/native_release.json GigaForge/README.md GIGAFORGE_H2H_DOWNLOAD.md research/GigaForge-h2h-release.json
          git add -f downloads/GigaForge-native-h2h-*.zip downloads/GigaForge-200x100-WDL-Update.zip downloads/NovaForge-GigaForge-200x100-WDL-Windows.zip
          git commit -m 'Publish Windows-tested 200x100 frozen WDL packages [skip ci]'
          git push origin HEAD:codex/novaforge-v1
