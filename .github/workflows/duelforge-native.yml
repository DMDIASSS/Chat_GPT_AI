name: DuelForge native Windows
on:
  push:
    branches: [codex/duelforge-research-20261116]
    paths: ['duelforge/native/**', 'duelforge/CMakeLists.txt', 'duelforge/duelforge/observation.py', 'duelforge/tests/windows_native_smoke.py', '.github/workflows/duelforge-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: duelforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install pybind11==2.13.6 numpy==2.2.6
      - run: python tools/fetch_rocketsim.py
      - shell: pwsh
        run: |
          $pybind = python -m pybind11 --cmakedir
          cmake -S . -B build -A x64 "-Dpybind11_DIR=$pybind" "-DPython_EXECUTABLE=$((Get-Command python).Source)"
          cmake --build build --config Release --parallel 4
          Copy-Item build/Release/_native*.pyd duelforge/
      - run: python tests/windows_native_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: duelforge-cp311-windows-x64
          path: duelforge/duelforge/*.pyd
          if-no-files-found: error
