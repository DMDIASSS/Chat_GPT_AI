name: RocketHive v4.22 Windows Galactus replay judge checks
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['downloads/RocketHive_v4_22_GALACTUS_REPLAY_JUDGE_UPDATE.zip', '.github/workflows/rockethive-v422.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU test dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "numpy>=1.26,<3" "pyarrow>=20,<30" pytest requests rocketsim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all updates and preserve existing user files
        shell: python
        run: |
          import zipfile,hashlib,pathlib,shutil
          root=pathlib.Path('rockethive_test');root.mkdir()
          for n in ('models/preserved.pt','data/preserved.txt','.venv/preserved.txt','config.json'):
              p=root/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_text('PRESERVED')
          for filename,sha,manifest in [
              ('RocketHive_FINAL_v4_20_REPLAY_TRAINING_IN_PLACE.zip','c4a20b5b39efa8fa3fb63f97f046e162656c17c90d2ee552b7e2bd14e1943722','V420_MANIFEST.sha256'),
              ('RocketHive_v4_22_GALACTUS_REPLAY_JUDGE_UPDATE.zip','7b4a4a0801c0b2508ea46c373b603cee7136d72fd6ad6b6d74c947ec58949b2b','V422_MANIFEST.sha256')]:
              p=pathlib.Path('downloads')/filename;assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  for line in z.read(manifest).decode().splitlines():
                      h,n=line.split('  ',1);assert hashlib.sha256(z.read(n)).hexdigest()==h
                  assert not any(n in z.namelist() for n in ('config.json','config_v4.json','requirements.txt'))
                  z.extractall(root)
          for n in ('models/preserved.pt','data/preserved.txt','.venv/preserved.txt','config.json'):
              assert (root/n).read_text()=='PRESERVED'
          for name in ('config.json','config_v4.json','requirements.txt'):
              p=pathlib.Path(name);shutil.copy2(root/'v415_reference'/(p.stem+'.example'+p.suffix),root/name)
      - name: Full suite, preparation-to-optimizer integration and deployment gates
        working-directory: rockethive_test
        run: |
          python -m compileall -q src tools rlbot_hive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -S -m tools.report_hive_v415
      - uses: actions/upload-artifact@v4
        with:
          name: RocketHive-v422-tested-update
          path: downloads/RocketHive_v4_22_GALACTUS_REPLAY_JUDGE_UPDATE.zip
