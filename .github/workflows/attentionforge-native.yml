name: AttentionForge native Windows
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['attentionforge-src/**', '.github/workflows/attentionforge-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: attentionforge-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install pybind11==2.13.6 numpy==2.2.6
      - run: python tools/fetch_rocketsim.py
      - shell: pwsh
        run: |
          $pybind = python -m pybind11 --cmakedir
          cmake -S . -B build -A x64 "-Dpybind11_DIR=$pybind" "-DPython_EXECUTABLE=$((Get-Command python).Source)"
          cmake --build build --config Release --parallel 4
          Copy-Item build/Release/_attention_native*.pyd attentionforge/
      - run: python -c "from attentionforge import _attention_native as n; from attentionforge.observation import ACTIONS; import numpy as np; np.testing.assert_array_equal(n.action_table(), ACTIONS); print('WINDOWS_NATIVE_LOAD_ACTION_PARITY_PASS', n.contract)"
      - run: python tests/windows_native_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: attentionforge-cp311-windows-x64
          path: attentionforge-src/attentionforge/*.pyd
          if-no-files-found: error
