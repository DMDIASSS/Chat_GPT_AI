name: RocketHive v4.15 Windows update checks
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['downloads/RocketHive_v4_15_REPLAY_BC_LIVE_HIVE_IN_PLACE.zip', '.github/workflows/rockethive-v415.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing-compatible CPU test dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "numpy>=1.26,<3" "pyarrow>=20,<30" pytest requests rocketsim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify immutable update and prepare reference-only test configs
        shell: python
        run: |
          import zipfile,hashlib,pathlib,shutil
          p=pathlib.Path('downloads/RocketHive_v4_15_REPLAY_BC_LIVE_HIVE_IN_PLACE.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d2b19a87a3b9f9da9b907d4c7ce28c0ab9cc6150f2c910d2e9443357aa004cde'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for line in z.read('V415_MANIFEST.sha256').decode().splitlines():
                  h,n=line.split('  ',1);assert hashlib.sha256(z.read(n)).hexdigest()==h
              assert not any(n in z.namelist() for n in ('config.json','config_v4.json','requirements.txt'))
              z.extractall('rockethive_test')
          for name in ('config.json','config_v4.json','requirements.txt'):
              n=pathlib.Path(name);shutil.copy2(pathlib.Path('rockethive_test/v415_reference')/(n.stem+'.example'+n.suffix),pathlib.Path('rockethive_test')/name)
      - name: Legacy preservation, replay labels, RVQ, team IPC and controller routing
        working-directory: rockethive_test
        run: |
          python -m compileall -q src tools rlbot_hive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: RocketHive-v415-tested-update
          path: downloads/RocketHive_v4_15_REPLAY_BC_LIVE_HIVE_IN_PLACE.zip
