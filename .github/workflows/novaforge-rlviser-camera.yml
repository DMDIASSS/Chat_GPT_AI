name: Build NovaForge RLViser camera
on:
  push:
    branches: [codex/novaforge-v1]
    paths:
      - 'NovaForge/viewer/patch_rlviser.py'
      - '.github/workflows/novaforge-rlviser-camera.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-camera:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned MIT-licensed RLViser source
        shell: pwsh
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/VirxEC/rlviser.git
          git -C upstream fetch --depth 1 origin a4e524085cdb1601cf9c0af2f815591fb696db54
          git -C upstream checkout --detach FETCH_HEAD
          python NovaForge/viewer/patch_rlviser.py upstream
          rustfmt --edition 2024 upstream/src/camera.rs upstream/src/udp.rs upstream/src/settings/options.rs upstream/src/settings/gui.rs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'upstream -> target'
          cache-on-failure: 'true'
      - name: Build standalone Windows viewer
        shell: pwsh
        run: cargo build --manifest-path upstream/Cargo.toml --release --locked --no-default-features --features threaded
      - name: Stage binary and license
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force camera-release
          Copy-Item upstream/target/release/rlviser.exe camera-release/rlviser-novaforge-win64.exe
          Copy-Item upstream/LICENSE camera-release/RLVISER_LICENSE.txt
          $digest = (Get-FileHash camera-release/rlviser-novaforge-win64.exe -Algorithm SHA256).Hash.ToLower()
          "$digest  rlviser-novaforge-win64.exe" | Set-Content -Encoding ascii camera-release/rlviser-novaforge-win64.exe.sha256
          "Based on VirxEC/rlviser a4e524085cdb1601cf9c0af2f815591fb696db54 (MIT). Camera modifications by NovaForge: configurable horizontal FOV, distance/height/pitch, learner follow/ballcam and no artificial shake." | Set-Content camera-release/NOTICE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: novaforge-rlviser-camera-win64
          path: camera-release/*
      - name: Publish viewer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view novaforge-rlviser-v0.9.3-camera1 --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create novaforge-rlviser-v0.9.3-camera1 camera-release/* --repo ${{ github.repository }} --target ${{ github.sha }} --title "NovaForge RLViser camera build" --notes "Windows viewer built from pinned RLViser v0.9.3 source. Configurable FOV/distance/height/pitch, initial car-follow ballcam, no added camera shake. MIT license included."
          }
