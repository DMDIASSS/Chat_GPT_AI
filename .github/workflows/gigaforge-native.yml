name: GigaForge native Windows preview checks
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['GigaForge/**', '.github/workflows/gigaforge-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: NovaForge/requirements.txt
      - name: Runtime
        shell: pwsh
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r NovaForge/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: GigaForge/native
          key: native-windows-2022-torch291-py311-${{ hashFiles('GigaForge/src/**', 'GigaForge/CMakeLists.txt', 'GigaForge/tools/build_native.py', 'GigaForge/tools/patch_upstream.py') }}
      - name: Pinned native Release build
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python GigaForge/tools/build_native.py
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: GigaForge/native
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Feature, mask, action-table and exact actor parity
        run: python GigaForge/run.py verify --run native_check --device cpu
      - name: Actual native cross training, warmup, optimizer resume and timed evaluation
        run: python GigaForge/tests/check_native.py
      - name: Research reward search and fixed-rollout mathematical checks
        run: python -m pytest GigaForge/tests/test_research.py GigaForge/tests/test_runtime_finder.py -q
      - name: All-sample native collection, reward profiles, frozen trunks and serial resume
        run: python GigaForge/tests/check_research_native.py
      - name: Autonomous evaluation, pacing and native resume
        run: |
          python -m pytest GigaForge/tests/test_research_eval.py GigaForge/tests/test_research_pacing.py GigaForge/tests/test_native_access.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python GigaForge/tests/check_autonomous_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python GigaForge/tests/check_eval_rng.py
      - uses: actions/upload-artifact@v4
        with:
          name: GigaForge-windows-CPU-verified-preview
          path: GigaForge/native
