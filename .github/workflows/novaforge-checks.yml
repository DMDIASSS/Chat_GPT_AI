name: NovaForge Windows checks
on:
  push:
    branches: [codex/novaforge-v1]
    paths: ['NovaForge/**', 'TriadBot/**', '.github/workflows/novaforge-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NovaForge
    env:
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            NovaForge/requirements.txt
            NovaForge/requirements-viewer.txt
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: --no-deps -r requirements-viewer.txt
      - name: Core training checks (no live viewer ports)
        run: python -m pytest tests -q
      - name: Actual Chronos initialization and trajectory parity
        run: |
          python run.py fetch-teachers --names chronos,ripple,galactus,nexto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_chronos.py tests/test_chronos_finish.py tests/test_triad.py tests/test_triad_selector.py -q --chronos --teachers
      - name: Triad actual export v5 handshake and controls (no new venv)
        run: |
          python tests/check_triad_v5.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from nova.triad_selector import train; train('ci_selector',steps=32,forever=False,wandb='off')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_triad_v5.py --selector ../triadbot/runs/ci_selector/latest.pt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -c "from nova.triad_selector import evaluate; evaluate('ci_selector',pairs=1,seconds=1)"
      - name: Actual isolated reward experiment and optimizer resume
        run: python tests/check_research.py
      - name: Actual read-only selector probabilities and fixed-expert diagnostics
        run: python tests/check_selector_diagnostics.py
      - name: Selected Fusion refinement and four-expert selector integration
        run: |
          python tests/check_four_experts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_triad_v5.py --selector ../triadbot/runs/ci_selector_four/latest.pt
      - name: Isolated RLBot v4 export and official class importer
        run: |
          python -m pip install --target .v4sdk rlbot==1.68.0 "setuptools<81"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_v4_sdk.py --sdk-dir .v4sdk
      - name: Native UDP framing on Windows
        run: python -m pytest tests/test_viewer_protocol.py -q --viewer-udp
      - name: Occupied UDP ports skip without a native crash
        shell: python
        run: |
          import socket, subprocess, sys
          for port in (34254, 45243):
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                  sock.setsockopt(socket.SOL_SOCKET, socket.SO_EXCLUSIVEADDRUSE, 1)
                  sock.bind(('0.0.0.0', port))
                  result = subprocess.run([sys.executable, '-m', 'pytest', 'tests/test_viewer_protocol.py', '-q', '-rs', '--viewer-udp'], capture_output=True, text=True, timeout=30)
                  print(result.stdout, result.stderr)
                  assert result.returncode == 0 and '1 skipped' in result.stdout
